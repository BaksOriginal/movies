<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/png" href="../icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0613">
<title>🕹 Игры — 愛してる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../ui.css">
<link rel="stylesheet" href="../mobile.css" media="(max-width: 1023.98px)">
<link rel="stylesheet" href="../desktop.css" media="(min-width: 1024px)">
</head>

<body>

<div class="container">
    <div id="app"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../core.js"></script>
<script src="../shell.js"></script>
<script src="../randomizer.js"></script>
<script src="games.js"></script>
<script src="sudoku.js"></script>
<script src="duo.js"></script>
<script src="durak.js"></script>
<script>
    // Общий "app"-контейнер и auth-гейт: страница сама себя не рисует,
    // пока не придёт событие авторизации (см. initAuth() в core.js).
    initAuth({
        isRendered: () => app && app.innerHTML.trim(),
        onLogin: () => {
            initShell({
                page: "games",
                onNavigate: (id) => {
                    if (id === "games") { showGamesScreen(); return true; }
                    if (id === "random") { showRandomizerModal(); return true; }
                    return false;
                }
            });
            setShellSection("games");
            showGamesScreen();
        },
        onLogout: () => { location.href = "../"; }
    });
</script>

</body>
</html>
